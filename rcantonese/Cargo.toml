[package]
name = "r-cantonese"
version = "0.9.1"
edition = "2024"
build = "build.rs"

[lib]
name = "r_cantonese"
# rlib lets `cargo test` link the library; the shipped artifact is the cdylib.
crate-type = ["cdylib", "rlib"]

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_Debug",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Threading",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
embed-resource = "3"
